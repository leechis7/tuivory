name: TUIVORY package checks
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  go-platforms:
    name: Go facade / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
          cache-dependency-path: go/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify host-independent generation
        working-directory: go
        run: go run ./internal/cmd/facadegen --check
      - name: Run root-only native consumer with simulation output
        run: python tools/check_go_platforms.py --native
      - name: Compile Windows AMD64/ARM64 and Linux/macOS consumers
        if: runner.os == 'Linux'
        run: python tools/check_go_platforms.py
  api-reference:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
          cache-dependency-path: go/go.sum
      - name: Install documentation compiler
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Check generated public API references
        run: |
          RUSTC_BOOTSTRAP=1 cargo +1.88.0 rustdoc --manifest-path rust/Cargo.toml --locked --all-features --lib -- -Z unstable-options --output-format json
          python3 tools/generate_api_reference.py --rust-json .cache/rust/doc/tuivory.json --check
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test reference color checks
        run: python3 -m unittest discover -s tests -v
      - name: Validate palette example
        run: python3 tools/check_palette.py design/themes/lazyora-candidate.csv
      - name: Validate shared token export
        run: python3 tools/export_tokens.py --check
      - name: Validate shared tree navigation contract
        run: python3 tools/export_tree_cases.py --check
      - name: Validate shared optional SQL vocabulary
        run: python3 tools/export_syntax_words.py --check
      - name: Validate API lifecycle metadata and migration guides
        run: python3 tools/check_api_lifecycle.py
      - name: Validate local document targets
        run: python3 tools/check_links.py
      - name: Validate terminal sample script
        run: sh -n shell/examples/terminal-colors.sh
  go-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
          cache-dependency-path: go/go.sum
      - name: Test Go style packages and widgets with race detector
        run: make -C go test
      - name: Vet Go packages
        run: make -C go check
      - name: Verify SDK-only UI imports and compatibility exports
        run: python3 tools/check_ui_facade.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare Go, Python and Node.js token consumers
        run: make check-consumers
      - name: Verify isolated Go module
        run: python3 tools/check_go_module.py
      - name: Build one static Go showcase for the runner
        run: |
          make build
          test -x bin/go/tuivory-linux-x86_64
      - name: Check actual PTY startup and exit
        run: |
          python3 tools/smoke_playground.py bin/go/tuivory-linux-x86_64 --lang ko --resize
          python3 tools/smoke_playground.py bin/go/tuivory-linux-x86_64 --lang en --resize
      - name: Check public Tree example terminal lifecycle
        run: |
          python3 tools/smoke_playground.py bin/go/tuivory-linux-x86_64 --demo tree --lang ko
          python3 tools/smoke_playground.py bin/go/tuivory-linux-x86_64 --demo tree --lang en
      - name: Check public workspace example terminal lifecycle
        run: |
          python3 tools/smoke_playground.py bin/go/tuivory-linux-x86_64 --demo workspace --lang ko
          python3 tools/smoke_playground.py bin/go/tuivory-linux-x86_64 --demo workspace --lang en
          python3 tools/smoke_workspace.py bin/go/tuivory-linux-x86_64 --demo workspace
      - name: Check public catalog widgets
        run: |
          python3 tools/smoke_catalog.py bin/go/tuivory-linux-x86_64 --demo catalog --lang ko
          python3 tools/smoke_catalog.py bin/go/tuivory-linux-x86_64 --demo catalog --lang en
          python3 tools/smoke_catalog.py bin/go/tuivory-linux-x86_64 --demo catalog --mode collections --lang ko
          python3 tools/smoke_catalog.py bin/go/tuivory-linux-x86_64 --demo catalog --mode collections --lang en
          python3 tools/smoke_catalog.py bin/go/tuivory-linux-x86_64 --demo catalog --mode grid --lang ko
          python3 tools/smoke_catalog.py bin/go/tuivory-linux-x86_64 --demo catalog --mode grid --lang en
          python3 tools/smoke_catalog.py bin/go/tuivory-linux-x86_64 --demo catalog --mode feedback --lang ko
          python3 tools/smoke_catalog.py bin/go/tuivory-linux-x86_64 --demo catalog --mode feedback --lang en
          python3 tools/smoke_catalog.py bin/go/tuivory-linux-x86_64 --demo catalog --mode layout --lang ko
          python3 tools/smoke_catalog.py bin/go/tuivory-linux-x86_64 --demo catalog --mode layout --lang en
      - name: Check public focus and nested popup example
        run: |
          python3 tools/smoke_focus.py bin/go/tuivory-linux-x86_64 --demo focus --lang ko
          python3 tools/smoke_focus.py bin/go/tuivory-linux-x86_64 --demo focus --lang en
      - name: Check controls, editing and containers through terminal input
        run: |
          for lang in ko en; do
            python3 tools/smoke_controls.py bin/go/tuivory-linux-x86_64 --demo controls --lang "$lang"
            python3 tools/smoke_controls.py bin/go/tuivory-linux-x86_64 --demo controls --lang "$lang" --ascii
            python3 tools/smoke_modal.py bin/go/tuivory-linux-x86_64 --lang "$lang"
          done
      - name: Check optional SQL highlighting through the single Go import
        run: |
          for lang in ko en; do
            python3 tools/smoke_syntax.py bin/go/tuivory-linux-x86_64 --demo syntax --lang "$lang"
            python3 tools/smoke_syntax.py bin/go/tuivory-linux-x86_64 --demo syntax --lang "$lang" --ascii
          done
  rust-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust validation toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
      - name: Select Rust validation toolchain
        run: rustup default 1.85.1
      - name: Check embedded assets
        run: python3 tools/export_tokens.py --check
      - name: Test and lint Rust core
        run: make test-rust check-rust
      - name: Verify optional SQL analysis at the core MSRV
        run: cargo test --manifest-path rust/Cargo.toml --locked --features syntax-sql --test syntax
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
          cache-dependency-path: go/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare Go, Python, Node.js and Rust tokens
        run: make check-rust-consumers
      - name: Verify standalone Cargo package and external usage
        run: python3 tools/check_rust_module.py
  rust-ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure temporary Cargo output
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/tuivory-rust-ui" >> "$GITHUB_ENV"
      - name: Install optional adapter toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
      - name: Select optional adapter toolchain
        run: rustup default 1.88.0
      - name: Test and lint adapter and interactive host
        run: make test-rust-ui check-rust-ui
      - name: Build native executable for terminal checks
        run: cargo build --manifest-path rust/Cargo.toml --locked --features playground,syntax-sql --example showcase
      - name: Check Korean and English terminal lifecycle
        run: |
          python3 tools/smoke_playground.py "$CARGO_TARGET_DIR/debug/examples/showcase" --demo playground --lang ko
          python3 tools/smoke_playground.py "$CARGO_TARGET_DIR/debug/examples/showcase" --demo playground --lang en
      - name: Check controls, editing and containers through terminal input
        run: |
          for lang in ko en; do
            python3 tools/smoke_controls.py "$CARGO_TARGET_DIR/debug/examples/showcase" --demo controls --lang "$lang"
            python3 tools/smoke_controls.py "$CARGO_TARGET_DIR/debug/examples/showcase" --demo controls --lang "$lang" --ascii
          done
          python3 tools/snapshot_controls.py "$CARGO_TARGET_DIR/debug/examples/showcase" --demo controls --output "$RUNNER_TEMP/controls-images"
      - name: Verify reference rendering
        run: python3 tools/snapshot_rust.py "$CARGO_TARGET_DIR/debug/examples/showcase" --demo playground --output "$RUNNER_TEMP/tuivory-rust-images"
      - name: Check public Tree example and reference views
        run: |
          python3 tools/smoke_playground.py "$CARGO_TARGET_DIR/debug/examples/showcase" --demo tree --lang ko
          python3 tools/smoke_playground.py "$CARGO_TARGET_DIR/debug/examples/showcase" --demo tree --lang en
          python3 tools/snapshot_tree.py "$CARGO_TARGET_DIR/debug/examples/showcase" --demo tree --output "$RUNNER_TEMP/tuivory-tree-images"
      - name: Check public workspace example and reference views
        run: |
          python3 tools/smoke_playground.py "$CARGO_TARGET_DIR/debug/examples/showcase" --demo workspace --lang ko
          python3 tools/smoke_playground.py "$CARGO_TARGET_DIR/debug/examples/showcase" --demo workspace --lang en
          python3 tools/smoke_workspace.py "$CARGO_TARGET_DIR/debug/examples/showcase" --demo workspace
          python3 tools/snapshot_workspace.py "$CARGO_TARGET_DIR/debug/examples/showcase" --demo workspace --output "$RUNNER_TEMP/tuivory-workspace-images"
      - name: Check public focus scopes, popups and reference views
        run: |
          python3 tools/smoke_focus.py "$CARGO_TARGET_DIR/debug/examples/showcase" --demo focus --lang ko
          python3 tools/smoke_focus.py "$CARGO_TARGET_DIR/debug/examples/showcase" --demo focus --lang en
          python3 tools/snapshot_focus.py "$CARGO_TARGET_DIR/debug/examples/showcase" --demo focus --output "$RUNNER_TEMP/tuivory-focus-images"
      - name: Check public catalog widgets and references
        run: |
          python3 tools/smoke_catalog.py "$CARGO_TARGET_DIR/debug/examples/showcase" --demo catalog --lang ko
          python3 tools/smoke_catalog.py "$CARGO_TARGET_DIR/debug/examples/showcase" --demo catalog --lang en
          python3 tools/snapshot_catalog.py "$CARGO_TARGET_DIR/debug/examples/showcase" --demo catalog --output "$RUNNER_TEMP/catalog-images"
          python3 tools/smoke_catalog.py "$CARGO_TARGET_DIR/debug/examples/showcase" --demo catalog --mode collections --lang ko
          python3 tools/smoke_catalog.py "$CARGO_TARGET_DIR/debug/examples/showcase" --demo catalog --mode collections --lang en
          python3 tools/snapshot_catalog.py "$CARGO_TARGET_DIR/debug/examples/showcase" --demo catalog --mode collections --output "$RUNNER_TEMP/catalog-images"
          python3 tools/smoke_catalog.py "$CARGO_TARGET_DIR/debug/examples/showcase" --demo catalog --mode grid --lang ko
          python3 tools/smoke_catalog.py "$CARGO_TARGET_DIR/debug/examples/showcase" --demo catalog --mode grid --lang en
          python3 tools/snapshot_catalog.py "$CARGO_TARGET_DIR/debug/examples/showcase" --demo catalog --mode grid --output "$RUNNER_TEMP/catalog-images"
          python3 tools/smoke_catalog.py "$CARGO_TARGET_DIR/debug/examples/showcase" --demo catalog --mode feedback --lang ko
          python3 tools/smoke_catalog.py "$CARGO_TARGET_DIR/debug/examples/showcase" --demo catalog --mode feedback --lang en
          python3 tools/snapshot_catalog.py "$CARGO_TARGET_DIR/debug/examples/showcase" --demo catalog --mode feedback --output "$RUNNER_TEMP/catalog-images"
          python3 tools/smoke_catalog.py "$CARGO_TARGET_DIR/debug/examples/showcase" --demo catalog --mode layout --lang ko
          python3 tools/smoke_catalog.py "$CARGO_TARGET_DIR/debug/examples/showcase" --demo catalog --mode layout --lang en
          python3 tools/snapshot_catalog.py "$CARGO_TARGET_DIR/debug/examples/showcase" --demo catalog --mode layout --output "$RUNNER_TEMP/catalog-images"
      - name: Verify adapter from an external packaged dependency
        run: |
          python3 tools/check_rust_module.py --terminal-output "$RUNNER_TEMP/tuivory-session" --syntax-sql
          python3 tools/check_ui_session.py "$RUNNER_TEMP/tuivory-session"
      - name: Check optional SQL highlighting and reference rendering
        run: |
          for lang in ko en; do
            python3 tools/smoke_syntax.py "$CARGO_TARGET_DIR/debug/examples/showcase" --demo syntax --lang "$lang"
            python3 tools/smoke_syntax.py "$CARGO_TARGET_DIR/debug/examples/showcase" --demo syntax --lang "$lang" --ascii
          done
          python3 tools/snapshot_syntax.py "$CARGO_TARGET_DIR/debug/examples/showcase" --demo syntax --output "$RUNNER_TEMP/syntax-images"
  static-builds:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
          cache-dependency-path: go/go.sum
      - name: Configure temporary Cargo output
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/tuivory-static-rust" >> "$GITHUB_ENV"
      - name: Install static Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
          rustup target add x86_64-unknown-linux-musl
      - name: Check single static executable per language on the runner architecture
        run: |
          make build build-rust
          python3 tools/check_showcase.py bin/go/tuivory-linux-x86_64 bin/rust/tuivory-linux-x86_64
      - name: Export static external application checks
        run: |
          python3 tools/check_go_module.py --static-output "$RUNNER_TEMP/go-host"
          python3 tools/check_rust_module.py --ratatui --static-output "$RUNNER_TEMP/rust-host"
      - name: Check static external application ELF files
        run: python3 tools/check_static_elf.py --arch x86_64 "$RUNNER_TEMP/go-host" "$RUNNER_TEMP/rust-host"
  independent-languages:
    name: Independent language packages / Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ASAN_OPTIONS: detect_leaks=1
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.cache/npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install only Python and JS development dependencies
        run: |
          python -m pip install ./python build
          npm --prefix javascript ci --ignore-scripts --no-audit --no-fund
          npm --prefix javascript run build
      - name: Validate independent models and data
        run: |
          python tools/export_language_data.py --check
          python -m unittest discover -s python/tests -v
          npm --prefix javascript test
          make test-c test-cpp test-java
          python tools/check_language_workspace.py --language c
          python tools/check_language_workspace.py --language cpp
          python tools/check_language_workspace.py --language java
          python tools/check_language_text.py --language c
          python tools/check_language_text.py --language cpp
          python tools/check_language_text.py --language java
          python tools/check_language_forms.py --language c
          python tools/check_language_forms.py --language cpp
          python tools/check_language_forms.py --language java
          python tools/check_language_focus.py --language c
          python tools/check_language_focus.py --language cpp
          python tools/check_language_focus.py --language java
          python tools/check_language_collections.py --language c
          python tools/check_language_collections.py --language cpp
          python tools/check_language_collections.py --language java
          python tools/check_language_menu.py --language c
          python tools/check_language_menu.py --language cpp
          python tools/check_language_menu.py --language java
      - name: Build and install runtime packages outside the repository
        run: |
          mkdir -p .cache/packages/javascript
          python -m build python --outdir .cache/packages/python
          python -m pip download --only-binary=:all: --dest .cache/packages/python/deps regex wcwidth
          npm pack ./javascript --pack-destination .cache/packages/javascript
          python tools/check_runtime_languages.py
          python tools/package_languages.py
          python tools/check_language_archives.py
  independent-examples:
    name: Independent examples / ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript, c, cpp, java]
    env:
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.cache/npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build only the selected language on this native runner
        shell: bash
        run: |
          case "${{ matrix.language }}" in
            python) python -m pip install ./python ;;
            javascript)
              npm --prefix javascript ci --ignore-scripts --no-audit --no-fund
              npm --prefix javascript run build
              ;;
            c|cpp|java) python tools/build_language.py "${{ matrix.language }}" ;;
          esac
      - name: Validate all locale/theme/profile/glyph combinations
        shell: bash
        run: |
          for demo in tree workspace text form list picker menu context-menu; do
            python tools/check_language_examples.py --language "${{ matrix.language }}" --demo "$demo" --matrix
          done
