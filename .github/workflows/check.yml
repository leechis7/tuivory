name: TUIVORY package checks
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test reference color checks
        run: python3 -m unittest discover -s tests -v
      - name: Validate palette example
        run: python3 tools/check_palette.py design/themes/lazyora-candidate.csv
      - name: Validate shared token export
        run: python3 tools/export_tokens.py --check
      - name: Validate shared tree navigation contract
        run: python3 tools/export_tree_cases.py --check
      - name: Validate local document targets
        run: python3 tools/check_links.py
      - name: Validate terminal sample script
        run: sh -n shell/examples/terminal-colors.sh
  go-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
          cache-dependency-path: go/go.sum
      - name: Test Go style packages and widgets with race detector
        run: make -C go test
      - name: Vet Go packages
        run: make -C go check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare Go, Python and Node.js token consumers
        run: make check-consumers
      - name: Verify isolated Go module
        run: python3 tools/check_go_module.py
      - name: Build Linux ARM64 playground
        run: |
          make build
          test -x bin/go/tuivory-linux-arm64
      - name: Build native executable for terminal smoke check
        run: go build -C go -o "$RUNNER_TEMP/tuivory" ./cmd/tuivory
      - name: Check actual PTY startup and exit
        run: |
          python3 tools/smoke_playground.py "$RUNNER_TEMP/tuivory" --lang ko
          python3 tools/smoke_playground.py "$RUNNER_TEMP/tuivory" --lang en
      - name: Check public Tree example terminal lifecycle
        run: |
          go build -C go -o "$RUNNER_TEMP/tuivory-tree" ./examples/tree
          python3 tools/smoke_playground.py "$RUNNER_TEMP/tuivory-tree" --lang ko
          python3 tools/smoke_playground.py "$RUNNER_TEMP/tuivory-tree" --lang en
  rust-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust validation toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
      - name: Select Rust validation toolchain
        run: rustup default 1.85.1
      - name: Check embedded assets
        run: python3 tools/export_tokens.py --check
      - name: Test and lint Rust core
        run: make test-rust check-rust
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
          cache-dependency-path: go/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare Go, Python, Node.js and Rust tokens
        run: make check-rust-consumers
      - name: Verify standalone Cargo package and external usage
        run: python3 tools/check_rust_module.py
  rust-ui:
    runs-on: ubuntu-24.04
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/tuivory-rust-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install optional adapter toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
      - name: Select optional adapter toolchain
        run: rustup default 1.88.0
      - name: Test and lint adapter and interactive host
        run: make test-rust-ui check-rust-ui
      - name: Build native executable for terminal checks
        run: cargo build --manifest-path rust/Cargo.toml --locked --features playground --examples
      - name: Check Korean and English terminal lifecycle
        run: |
          python3 tools/smoke_playground.py "$CARGO_TARGET_DIR/debug/examples/playground" --lang ko
          python3 tools/smoke_playground.py "$CARGO_TARGET_DIR/debug/examples/playground" --lang en
      - name: Verify reference rendering
        run: python3 tools/snapshot_rust.py "$CARGO_TARGET_DIR/debug/examples/playground" --output "$RUNNER_TEMP/tuivory-rust-images"
      - name: Check public Tree example and reference views
        run: |
          python3 tools/smoke_playground.py "$CARGO_TARGET_DIR/debug/examples/tree" --lang ko
          python3 tools/smoke_playground.py "$CARGO_TARGET_DIR/debug/examples/tree" --lang en
          python3 tools/snapshot_tree.py "$CARGO_TARGET_DIR/debug/examples/tree" --output "$RUNNER_TEMP/tuivory-tree-images"
      - name: Verify adapter from an external packaged dependency
        run: python3 tools/check_rust_module.py --ratatui
