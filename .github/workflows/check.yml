name: TUIVORY package checks
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test reference color checks
        run: python3 -m unittest discover -s tests -v
      - name: Validate palette example
        run: python3 tools/check_palette.py design/themes/lazyora-candidate.csv
      - name: Validate shared token export
        run: python3 tools/export_tokens.py --check
      - name: Validate shared tree navigation contract
        run: python3 tools/export_tree_cases.py --check
      - name: Validate local document targets
        run: python3 tools/check_links.py
      - name: Validate terminal sample script
        run: sh -n shell/examples/terminal-colors.sh
  go-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
          cache-dependency-path: go/go.sum
      - name: Test Go style packages and widgets with race detector
        run: make -C go test
      - name: Vet Go packages
        run: make -C go check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare Go, Python and Node.js token consumers
        run: make check-consumers
      - name: Verify isolated Go module
        run: python3 tools/check_go_module.py
      - name: Build Linux ARM64 playground
        run: |
          make build
          test -x bin/go/tuivory-linux-arm64
      - name: Build native executable for terminal smoke check
        run: go build -C go -o "$RUNNER_TEMP/tuivory" ./cmd/tuivory
      - name: Check actual PTY startup and exit
        run: |
          python3 tools/smoke_playground.py "$RUNNER_TEMP/tuivory" --lang ko --resize
          python3 tools/smoke_playground.py "$RUNNER_TEMP/tuivory" --lang en --resize
      - name: Check public Tree example terminal lifecycle
        run: |
          go build -C go -o "$RUNNER_TEMP/tuivory-tree" ./examples/tree
          python3 tools/smoke_playground.py "$RUNNER_TEMP/tuivory-tree" --lang ko
          python3 tools/smoke_playground.py "$RUNNER_TEMP/tuivory-tree" --lang en
      - name: Check public workspace example terminal lifecycle
        run: |
          go build -C go -o "$RUNNER_TEMP/tuivory-workspace" ./examples/workspace
          python3 tools/smoke_playground.py "$RUNNER_TEMP/tuivory-workspace" --lang ko
          python3 tools/smoke_playground.py "$RUNNER_TEMP/tuivory-workspace" --lang en
          python3 tools/smoke_workspace.py "$RUNNER_TEMP/tuivory-workspace"
      - name: Check public catalog widgets
        run: |
          go build -C go -o "$RUNNER_TEMP/tuivory-catalog" ./examples/catalog
          python3 tools/smoke_catalog.py "$RUNNER_TEMP/tuivory-catalog" --lang ko
          python3 tools/smoke_catalog.py "$RUNNER_TEMP/tuivory-catalog" --lang en
          python3 tools/smoke_catalog.py "$RUNNER_TEMP/tuivory-catalog" --mode collections --lang ko
          python3 tools/smoke_catalog.py "$RUNNER_TEMP/tuivory-catalog" --mode collections --lang en
          python3 tools/smoke_catalog.py "$RUNNER_TEMP/tuivory-catalog" --mode grid --lang ko
          python3 tools/smoke_catalog.py "$RUNNER_TEMP/tuivory-catalog" --mode grid --lang en
          python3 tools/smoke_catalog.py "$RUNNER_TEMP/tuivory-catalog" --mode feedback --lang ko
          python3 tools/smoke_catalog.py "$RUNNER_TEMP/tuivory-catalog" --mode feedback --lang en
          python3 tools/smoke_catalog.py "$RUNNER_TEMP/tuivory-catalog" --mode layout --lang ko
          python3 tools/smoke_catalog.py "$RUNNER_TEMP/tuivory-catalog" --mode layout --lang en
      - name: Check public focus and nested popup example
        run: |
          go build -C go -o "$RUNNER_TEMP/tuivory-focus" ./examples/focus
          python3 tools/smoke_focus.py "$RUNNER_TEMP/tuivory-focus" --lang ko
          python3 tools/smoke_focus.py "$RUNNER_TEMP/tuivory-focus" --lang en
  rust-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust validation toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
      - name: Select Rust validation toolchain
        run: rustup default 1.85.1
      - name: Check embedded assets
        run: python3 tools/export_tokens.py --check
      - name: Test and lint Rust core
        run: make test-rust check-rust
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
          cache-dependency-path: go/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare Go, Python, Node.js and Rust tokens
        run: make check-rust-consumers
      - name: Verify standalone Cargo package and external usage
        run: python3 tools/check_rust_module.py
  rust-ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure temporary Cargo output
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/tuivory-rust-ui" >> "$GITHUB_ENV"
      - name: Install optional adapter toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
      - name: Select optional adapter toolchain
        run: rustup default 1.88.0
      - name: Test and lint adapter and interactive host
        run: make test-rust-ui check-rust-ui
      - name: Build native executable for terminal checks
        run: cargo build --manifest-path rust/Cargo.toml --locked --features playground --examples
      - name: Check Korean and English terminal lifecycle
        run: |
          python3 tools/smoke_playground.py "$CARGO_TARGET_DIR/debug/examples/playground" --lang ko
          python3 tools/smoke_playground.py "$CARGO_TARGET_DIR/debug/examples/playground" --lang en
      - name: Verify reference rendering
        run: python3 tools/snapshot_rust.py "$CARGO_TARGET_DIR/debug/examples/playground" --output "$RUNNER_TEMP/tuivory-rust-images"
      - name: Check public Tree example and reference views
        run: |
          python3 tools/smoke_playground.py "$CARGO_TARGET_DIR/debug/examples/tree" --lang ko
          python3 tools/smoke_playground.py "$CARGO_TARGET_DIR/debug/examples/tree" --lang en
          python3 tools/snapshot_tree.py "$CARGO_TARGET_DIR/debug/examples/tree" --output "$RUNNER_TEMP/tuivory-tree-images"
      - name: Check public workspace example and reference views
        run: |
          python3 tools/smoke_playground.py "$CARGO_TARGET_DIR/debug/examples/workspace" --lang ko
          python3 tools/smoke_playground.py "$CARGO_TARGET_DIR/debug/examples/workspace" --lang en
          python3 tools/smoke_workspace.py "$CARGO_TARGET_DIR/debug/examples/workspace"
          python3 tools/snapshot_workspace.py "$CARGO_TARGET_DIR/debug/examples/workspace" --output "$RUNNER_TEMP/tuivory-workspace-images"
      - name: Check public focus scopes, popups and reference views
        run: |
          python3 tools/smoke_focus.py "$CARGO_TARGET_DIR/debug/examples/focus" --lang ko
          python3 tools/smoke_focus.py "$CARGO_TARGET_DIR/debug/examples/focus" --lang en
          python3 tools/snapshot_focus.py "$CARGO_TARGET_DIR/debug/examples/focus" --output "$RUNNER_TEMP/tuivory-focus-images"
      - name: Check public catalog widgets and references
        run: |
          python3 tools/smoke_catalog.py "$CARGO_TARGET_DIR/debug/examples/catalog" --lang ko
          python3 tools/smoke_catalog.py "$CARGO_TARGET_DIR/debug/examples/catalog" --lang en
          python3 tools/snapshot_catalog.py "$CARGO_TARGET_DIR/debug/examples/catalog" --output "$RUNNER_TEMP/catalog-images"
          python3 tools/smoke_catalog.py "$CARGO_TARGET_DIR/debug/examples/catalog" --mode collections --lang ko
          python3 tools/smoke_catalog.py "$CARGO_TARGET_DIR/debug/examples/catalog" --mode collections --lang en
          python3 tools/snapshot_catalog.py "$CARGO_TARGET_DIR/debug/examples/catalog" --mode collections --output "$RUNNER_TEMP/catalog-images"
          python3 tools/smoke_catalog.py "$CARGO_TARGET_DIR/debug/examples/catalog" --mode grid --lang ko
          python3 tools/smoke_catalog.py "$CARGO_TARGET_DIR/debug/examples/catalog" --mode grid --lang en
          python3 tools/snapshot_catalog.py "$CARGO_TARGET_DIR/debug/examples/catalog" --mode grid --output "$RUNNER_TEMP/catalog-images"
          python3 tools/smoke_catalog.py "$CARGO_TARGET_DIR/debug/examples/catalog" --mode feedback --lang ko
          python3 tools/smoke_catalog.py "$CARGO_TARGET_DIR/debug/examples/catalog" --mode feedback --lang en
          python3 tools/snapshot_catalog.py "$CARGO_TARGET_DIR/debug/examples/catalog" --mode feedback --output "$RUNNER_TEMP/catalog-images"
          python3 tools/smoke_catalog.py "$CARGO_TARGET_DIR/debug/examples/catalog" --mode layout --lang ko
          python3 tools/smoke_catalog.py "$CARGO_TARGET_DIR/debug/examples/catalog" --mode layout --lang en
          python3 tools/snapshot_catalog.py "$CARGO_TARGET_DIR/debug/examples/catalog" --mode layout --output "$RUNNER_TEMP/catalog-images"
      - name: Verify adapter from an external packaged dependency
        run: python3 tools/check_rust_module.py --ratatui
  static-builds:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
          cache-dependency-path: go/go.sum
      - name: Configure temporary Cargo output
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/tuivory-static-rust" >> "$GITHUB_ENV"
      - name: Install static Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
          rustup target add aarch64-unknown-linux-musl x86_64-unknown-linux-musl
      - name: Check default ARM64 static builds and explicit x86_64 builds
        run: |
          make build build-rust build-go-x86_64 build-rust-x86_64
          python3 tools/build_rust.py --arch x86_64 --examples
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -C go -trimpath -o "$RUNNER_TEMP/go-tree" ./examples/tree
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -C go -trimpath -o "$RUNNER_TEMP/go-workspace" ./examples/workspace
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -C go -trimpath -o "$RUNNER_TEMP/go-focus" ./examples/focus
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -C go -trimpath -o "$RUNNER_TEMP/go-catalog" ./examples/catalog
      - name: Export static external application checks
        run: |
          python3 tools/check_go_module.py --static-output "$RUNNER_TEMP/go-host"
          python3 tools/check_rust_module.py --ratatui --static-output "$RUNNER_TEMP/rust-host"
      - name: Check static external application ELF files
        run: python3 tools/check_static_elf.py --arch x86_64 "$RUNNER_TEMP/go-host" "$RUNNER_TEMP/rust-host"
