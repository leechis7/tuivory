[package]
name = "tuivory"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
description = "Framework-independent terminal UI design tokens and styles"
license = "AGPL-3.0-only"
repository = "https://github.com/leechis7/tuivory"
readme = "README.en.md"
publish = false
include = ["src/**", "examples/**", "tests/**", "Cargo.toml", "Cargo.lock", "README*.md", "NOTICE*.md", "LICENSE"]

[features]
default = []
ratatui = ["dep:ratatui"]
playground = ["ratatui", "ratatui/crossterm", "dep:crossterm"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
ratatui = { version = "0.30.2", default-features = false, optional = true }
crossterm = { version = "0.29", optional = true }

[[example]]
name = "playground"
path = "examples/playground/main.rs"
required-features = ["playground"]

[[example]]
name = "tree"
path = "examples/tree/main.rs"
required-features = ["playground"]

[[example]]
name = "workspace"
path = "examples/workspace/main.rs"
required-features = ["playground"]
